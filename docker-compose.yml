services:
  postgres:
    image: postgres:15-alpine
    container_name: db_container_ouvidoria
    environment:
      POSTGRES_USER: db_ouvidoria_user
      POSTGRES_PASSWORD: db_ouvidoria_password
      POSTGRES_DB: db_ouvidoria_backend
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
